# ==============================================================================
# /etc/ssh/sshd_config.d/00-hardening.conf & Konfigurasi Hardening Server Linux
# Standar: CIS Ubuntu/Debian Benchmark & Indeks Lynis >= 70
# Rujukan Risiko Tugas 1: TH-10 (Privilege Escalation Server & Brute-Force Auth)
# ==============================================================================

# 1. Kontrol Akses dan Otentikasi SSH
Port 22
Protocol 2

# Wajib: Larang login langsung sebagai superuser 'root'
PermitRootLogin no

# Wajib: Nonaktifkan otentikasi kata sandi (Hanya perbolehkan Public Key)
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Batasi jumlah percobaan otentikasi sebelum koneksi diputus
MaxAuthTries 3
MaxSessions 2

# 2. Pembatasan Sesi & Enkripsi
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2

# 3. Kriptografi Terpilih (Kex, Ciphers, MACs Modern)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# 4. Banner Peringatan Legal
Banner /etc/issue.net

